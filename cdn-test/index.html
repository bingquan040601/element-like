<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>element-like CDN 冒烟测试（UMD）</title>
    <link rel="stylesheet" href="/dist/umd/style.css" />
  </head>
  <body>
    <div
      id="app"
      style="padding: 24px; display: flex; flex-direction: column; gap: 16px; max-width: 720px"
    >
      <div style="display: flex; gap: 8px; align-items: center">
        <el-like-button type="primary">Primary 按钮</el-like-button>
        <el-like-button type="success" plain>朴素成功</el-like-button>
        <el-like-button type="warning" round>圆角按钮</el-like-button>
      </div>
      <div style="display: flex; gap: 16px; align-items: center">
        <!-- 注意：HTML 解析器不支持自定义元素的 /> 自闭合，必须显式写闭合标签 -->
        <el-like-icon icon="house" type="primary" size="2x"></el-like-icon>
        <el-like-icon icon="heart" type="danger" size="2x"></el-like-icon>
        <el-like-icon icon="star" type="warning" size="2x"></el-like-icon>
      </div>
      <el-like-card :width="320" :img-src="img" summary="CDN 场景下 Card 组件渲染正常">
        <el-like-button type="primary">卡片操作</el-like-button>
      </el-like-card>
      <el-like-collapse>
        <el-like-collapse-item name="1" title="折叠面板一">内容一</el-like-collapse-item>
        <el-like-collapse-item name="2" title="折叠面板二">内容二</el-like-collapse-item>
      </el-like-collapse>
      <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap">
        <el-like-tooltip content="tooltip 提示内容">
          <el-like-button>悬停提示</el-like-button>
        </el-like-tooltip>
        <el-like-dropdown :menu-options="menus">
          <el-like-button type="primary">下拉菜单 ▾</el-like-button>
        </el-like-dropdown>
        <el-like-button type="danger" @click="visible = true">打开 Dialog</el-like-button>
        <el-like-dialog v-model:visible="visible" title="CDN 冒烟测试">
          Dialog 内容渲染正常
        </el-like-dialog>
      </div>
      <el-like-pager :total="50"></el-like-pager>
    </div>

    <!-- CDN 消费链路：先挂 Vue 全局，再挂组件库 UMD 产物 -->
    <script src="/node_modules/vue/dist/vue.global.prod.js"></script>
    <script src="/dist/umd/element-like.umd.cjs"></script>
    <script>
      console.log('Vue version:', Vue.version, ElementLike)
      const app = Vue.createApp({
        data() {
          return {
            visible: false,
            img:
              'data:image/svg+xml;utf8,' +
              encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="120"><rect width="100%" height="100%" fill="#409eff"/><text x="50%" y="55%" fill="#fff" text-anchor="middle" font-size="20">Card Image</text></svg>',
              ),
            menus: [
              { label: '操作一', value: 'a' },
              { label: '操作二', value: 'b' },
            ],
          }
        },
      })
      app.use(ElementLike)
      app.mount('#app')
    </script>
  </body>
</html>
