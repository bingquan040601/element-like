# 构建组件示例站点并部署到 GitHub Pages（https://bingquan040601.github.io/element-like/）
name: Deploy showcase site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署所需权限：读取源码、写入 Pages、申请 OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，新提交会取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:site
      # GitHub Pages 没有 SPA 回退：把 index.html 复制为 404.html，
      # 直接访问 /button 等深层路由时由 404 页接管并交给 vue-router 解析
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
